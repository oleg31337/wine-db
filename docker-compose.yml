# wine-db - private wine tasting database
#
# Everything is configured in .env (copy .env.example). The frontend receives no
# backend configuration at any point.
#
#   docker compose up -d --build
#
# TLS is terminated by your reverse proxy; this stack speaks plain HTTP on the
# loopback port you choose in .env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winedb}
      POSTGRES_USER: ${POSTGRES_USER:-wine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so ORDER BY behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Bind a host folder instead of a named volume: the data lives in
    # ${PG_DATA_DIR:-./pgdata} on the host, so it survives container removal
    # and is inspectable/backable-up directly.
    volumes:
      - ${PG_DATA_DIR:-./pgdata}:/var/lib/postgresql/data
    # Not published: only the app container reaches the database.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wine} -d ${POSTGRES_DB:-winedb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Stamp the deploy with the git commit SHA so every rebuild forces the
      # browser to fetch fresh JS (the SPA only loads scripts once per page load).
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-winedb}
      # All persistent state (DB via postgres bind-mount above, plus uploads and
      # backups) lives under this host folder. Bind it in the volumes section.
      DATA_DIR: /data

      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}

      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-false}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}

      # --- Administrator (the only account that can manage users / backups)
      # Generate the hash with:  python -m app.tools.admin_hash "<password>"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env}

      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      MAX_BACKUP_BYTES: ${MAX_BACKUP_BYTES:-536870912}

      # --- Label reading: vision model (OpenAI-compatible; also covers Ollama's shim)
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:latest}
      TEXT_MODEL: ${TEXT_MODEL:-}
      # --- Summarisation: can be a DIFFERENT provider from the vision model
      SUMMARY_MODEL: ${SUMMARY_MODEL:-nemotron-3-nano:4b}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}

      # --- Internet lookup
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}

      # --- Abuse limits (per client IP, per minute)
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-8}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-240}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-12}
    # Bind a host folder for all app data (uploads + backups + exports).
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      # Bind to loopback by default: your reverse proxy is the only front door.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    internal: true
  egress:
