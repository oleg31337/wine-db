# ---------------------------------------------------------------------------
# wine-db — sample nginx reverse-proxy config for an internet-exposed instance.
#
# Copy to /etc/nginx/sites-available/wine-db (or your conf.d) and adapt:
#   • server_name            -> your real public hostname
#   • the SSL certificate     -> your cert/key paths (e.g. Let's Encrypt)
#   • proxy_pass upstream     -> the app's bind address (loopback by default)
#   • the backup-import limit -> leave 512m if you restore large backups
#
# SECURITY NOTES (these matter — do not "simplify" them away):
#   1. We set  X-Forwarded-For: $remote_addr  (the REAL client). We must NOT use
#      $proxy_add_x_forwarded_for, because that appends the client's own header
#      value and would let anyone spoof their IP. Together with the app's
#      FORWARDED_ALLOW_IPS (restricted to this proxy), the app then sees the
#      true client IP and cannot be bypassed on its rate limiter / login throttle.
#   2. The nginx-level limit_req on /api/auth/login keys on $binary_remote_addr
#      (the TLS peer = the real client), so it is spoof-proof even if the app
#      layer were ever misconfigured. Keep it — it is cheap and blocks brute force.
#   3. TLS terminates here; the app speaks plain HTTP on loopback only.
# ---------------------------------------------------------------------------

# Shared rate-limit zone (spoof-proof: keyed on the real remote address).
limit_req_zone $binary_remote_addr zone=winedb_login:10m rate=20r/m;

# Optional: a zone for the whole site to blunt scrapers/DoS (commented by default).
# limit_req_zone $binary_remote_addr zone=winedb_site:10m rate=30r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name wine.example.com;   # <-- set your real hostname

    # --- TLS (adapt paths; Let's Encrypt certbot is the easy route) ----
    ssl_certificate     /etc/letsencrypt/live/wine.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wine.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Uploads: photos are capped at 8 MiB app-side; browser downscales first.
    # Leave this at ~12m for photos. The large backup-restore limit is set only
    # on the /api/backup/import location below, so attackers can't push 500 MB
    # bodies at every endpoint.
    client_max_body_size 12m;

    # --- Security / hardening headers (the app sends most; these add the rest
    # --- and make sure a plain-negotiated downgrade can't drop HSTS).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The app already emits a strict CSP; only add if you won't override it.
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # Hide nginx version.
    server_tokens off;

    # --- Proxy the app ---------------------------------------------------
    location / {
        # Optional whole-site anti-scrape limiter:
        # limit_req zone=winedb_site burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # REAL client IP only — never pass through a client-supplied header:
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # App requests must be revalidated, not cached by nginx.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Timeouts generous enough for the scan/AI pipeline (AI_TIMEOUT_SECONDS).
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    60s;

        # WebSocket/event support if the app ever needs it (harmless to keep):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Brute-force guard: spoof-proof limit on login/password endpoints ----
    location ~ ^/api/auth/(login|password)$ {
        limit_req zone=winedb_login burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    60s;
    }

    # --- Backup restore needs a larger body limit (matches MAX_BACKUP_BYTES) ---
    location = /api/backup/import {
        client_max_body_size 512m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    120s;
    }
}

# Redirect all plain-HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name wine.example.com;
    return 301 https://$host$request_uri;
}
